[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-content-capturer"
version = "0.1.0"
description = "Share an Instagram reel to a bot; it transcribes, reads the screen, and files the idea into a content bank."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.0",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "av>=12",
    "pillow>=10",
    "python-telegram-bot>=21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
capturer = "capturer.cli:main"

[tool.setuptools.packages.find]
include = ["capturer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
